name: Publish to npm

# Dispara quando uma Release é publicada no GitHub.
# Fluxo esperado:
#   1. Criar uma Release no GitHub com tag vX.Y.Z
#   2. Este workflow verifica se package.json já tem a versão correta.
#      Se não tiver, atualiza e commita na main automaticamente.
#   3. Roda CI completo e publica no npm via OIDC.
#
# Pré-requisito no npmjs.com:
#   Pacote → Settings → Publishing → Trusted Publishers
#   Adicionar: owner=andrejfg  repo=gerador-nfse-nacional-bun  workflow=publish.yml

on:
  release:
    types: [published]

permissions:
  contents: write  # necessário para commitar o auto-bump na main
  id-token: write  # necessário para o Trusted Publisher (OIDC)

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------------
      # Valida o formato da tag antes de qualquer outra coisa.
      # Padrão aceito: vX.Y.Z  (ex: v1.0.0, v0.2.1)
      # Tags fora do padrão interrompem o workflow imediatamente.
      # ----------------------------------------------------------------
      - name: Validate tag format
        run: |
          if ! echo "$GITHUB_REF_NAME" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ Tag '$GITHUB_REF_NAME' fora do padrão esperado (vX.Y.Z)."
            echo "   Publish cancelado. Corrija a tag da Release e tente novamente."
            exit 1
          fi
          echo "✅ Tag válida: $GITHUB_REF_NAME"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------------
      # Verifica a versão do package.json contra a tag da Release.
      # Se estiver desatualizada, atualiza e commita na main antes de
      # prosseguir com o build e o publish.
      # ----------------------------------------------------------------
      - name: Sync version from release tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json: $PKG_VERSION | Release tag: $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "⚠️  Versão desatualizada — atualizando package.json para $TAG_VERSION"
            npm version "$TAG_VERSION" --no-git-tag-version
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json
            git commit -m "chore: bump version to $TAG_VERSION [skip ci]"
            git push origin HEAD:main
            echo "✅ package.json atualizado e commitado na main"
          else
            echo "✅ Versão já correta: $PKG_VERSION"
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Node.js é necessário apenas para o `npm publish`
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ----------------------------------------------------------------
      # Suite completa — mesma do CI — antes de publicar
      # ----------------------------------------------------------------
      - name: Lint (Biome)
        run: bunx biome check --no-errors-on-unmatched src/ tests/

      - name: Typecheck
        run: bun tsc --noEmit

      - name: Tests
        run: bun test --coverage tests/crypto tests/utils tests/validator tests/xml

      - name: Build
        run: bun run build

      - name: E2E Integration Tests
        run: bun run test:e2e

      # ----------------------------------------------------------------
      # Publish via Trusted Publisher (OIDC — sem token no Secrets)
      # --provenance gera attestation de build verificável no npm
      # ----------------------------------------------------------------
      - name: Publish to npm
        run: npm publish --provenance --access public
