name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    name: Lint · Typecheck · Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ------------------------------------------------------------------
      # Lint — verifica formatação e estilo com Biome
      # ------------------------------------------------------------------
      - name: Lint (Biome)
        run: bunx biome check --no-errors-on-unmatched src/ tests/

      # ------------------------------------------------------------------
      # Typecheck — garante que o TypeScript está correto
      # ------------------------------------------------------------------
      - name: Typecheck
        run: bun tsc --noEmit

      # ------------------------------------------------------------------
      # Testes — roda toda a suite com cobertura
      # ------------------------------------------------------------------
      - name: Tests
        run: bun test --coverage tests/crypto tests/utils tests/validator tests/xml

      # ------------------------------------------------------------------
      # Build — gera JS (ESM, sem bundlar deps) + declarações .d.ts
      # ------------------------------------------------------------------
      - name: Build
        run: bun run build

      # ------------------------------------------------------------------
      # E2E — importa do dist/ como consumidor externo para detectar
      # erros de integração (caminhos de assets, exports ausentes etc.)
      # ------------------------------------------------------------------
      - name: E2E Integration Tests
        run: bun run test:e2e

  # SefinClient mTLS via node:https (Node não suporta tls no fetch)
  node-mtls:
    name: Node · mTLS SefinClient
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Build
        run: bun run build

      - name: mTLS smoke (Node + dist)
        run: node tests/http/sefin-client-node-mtls.test.mjs
