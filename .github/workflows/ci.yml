name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    name: Lint · Typecheck · Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ------------------------------------------------------------------
      # Lint — verifica formatação e estilo com Biome
      # ------------------------------------------------------------------
      - name: Lint (Biome)
        run: bunx biome check --no-errors-on-unmatched src/ tests/

      # ------------------------------------------------------------------
      # Typecheck — garante que o TypeScript está correto
      # ------------------------------------------------------------------
      - name: Typecheck
        run: bun tsc --noEmit

      # ------------------------------------------------------------------
      # Testes — roda toda a suite com cobertura
      # ------------------------------------------------------------------
      - name: Tests
        run: bun test --coverage tests/**/*.test.ts

      # ------------------------------------------------------------------
      # Build — verifica que o projeto compila sem erros
      # ------------------------------------------------------------------
      - name: Build
        run: bun build src/index.ts --outdir dist --target node
